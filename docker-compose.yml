services:
  django-sniffer:
    build: .
    container_name: django-sniffer
    ports:
      - "8001:8000"
    volumes:
      - .:/app
    environment:
      - DEBUG=True
    restart: always

  nginx:
    image: nginx:latest
    container_name: nginx-sniffer
    ports:
      - "80:80"
    depends_on:
      - django-sniffer
    restart: always

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-sniffer
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - django-sniffer
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: grafana-sniffer
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: always